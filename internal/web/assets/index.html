<section class="ask">
    <!--
      The whole claim in one sentence. It used to be a heading and a paragraph
      beneath it, which said the same thing twice at two sizes; the second
      half is the half that distinguishes this from every other checker, so it
      belongs in the line people read rather than the line they skim past.
    -->
    <h1>Check what a server<br>actually negotiates,<br>not what it advertises.</h1>

    <form class="ask-form" id="scan-form" autocomplete="off">
      <label class="field-label" for="target">Hostname</label>
      <div class="field-row">
        <input
          class="field"
          type="text"
          id="target"
          name="target"
          placeholder="example.com"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
          enterkeyhint="go"
          aria-describedby="field-help">
        <button class="submit" type="submit" id="submit">Check</button>
      </div>
      <p class="field-help" id="field-help">
        Port 443 unless you name another. Public hosts only. Scan only what you
        own, administer, or have permission to scan &mdash; the decision is
        yours and the <a href="/terms">terms</a> say so plainly.
        <a href="/privacy#scans">What a scan sends, and what this keeps</a> is
        written out in full.
      </p>
    </form>

    <!--
      The explanation used to sit here in full: what a scan sends, where the
      hostname travels, what is kept. All of it moved to the privacy page,
      said better and at length, and what was left behind was the link on its
      own in a paragraph of its own.

      That link has now joined the sentence above, which was already the place
      a reader decides whether to press the button and already carries the
      link to the terms. Two rules of documentation stacked under one field
      read as a page papered with notices, and a reader who learns to skip one
      notice skips the next.

      It is also the better target. A link alone in a paragraph is a control
      sixteen pixels high, under the twenty-four a pointer needs; the same
      link inside a sentence is an inline link, which is exempt because the
      sentence around it is what makes it findable.
    -->
    <noscript>
      <p class="noscript">
        Running a scan needs JavaScript, because the result is fetched and
        rendered in the page. The same scan is available from the command line
        tool in the repository, which needs nothing but Go.
      </p>
    </noscript>
  </section>

  <section class="result" id="result" aria-live="polite" aria-atomic="false" hidden></section>
