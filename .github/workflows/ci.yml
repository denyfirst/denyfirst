name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny by default at the top level. Jobs opt in to what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────
# This workflow uses no third-party actions. Not one.
#
# `actions/checkout` is replaced by four lines of git, which is already
# on the runner. `actions/setup-go` is unnecessary: since Go 1.21, if
# go.mod declares a newer version than the installed toolchain, the go
# command downloads the correct toolchain itself.
#
# Two things follow from that. The organisation policy requiring every
# action to be pinned to a full-length commit SHA cannot be violated,
# because there is nothing to pin. And the claim in README.md that this
# project has no third-party dependencies stays true in the build
# pipeline, not only in the shipped binary.
#
# The `go install ...@latest` lines below do fetch code, but through the
# Go module proxy, which verifies every module against the checksum
# database at sum.golang.org. That is a stronger integrity guarantee
# than a git tag, which anyone with write access can move.
# ─────────────────────────────────────────────────────────────────────

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Report toolchain
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go mod tidy modified the repository:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Verify module checksums
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test with race detector
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Build
        run: go build -trimpath ./...

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      # govulncheck reports only vulnerabilities on code paths actually
      # reachable from this module, so a hit here is a real problem rather
      # than a version-range guess.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # A fuzz target that exists and is not in the matrix is a target nobody
  # fuzzes.
  #
  # The matrix in fuzz.yml is written by hand, deliberately: one job per target
  # names the failing one in the job list. The cost is that adding a target
  # takes two edits in two files, and the second is easy to forget — and
  # forgetting it fails quietly. The target still runs against its seeds here,
  # so everything looks green while the generative run that would actually find
  # something never happens.
  #
  # This lives in CI rather than in fuzz.yml for the reason fuzz.yml gives for
  # keeping the seed corpus here: the check is deterministic, so it belongs on
  # the critical path. Generative fuzzing is not, so it does not. A guard that
  # only runs on a nightly schedule tells somebody about their mistake the
  # morning after they stopped thinking about it.
  fuzz-targets:
    name: Every fuzz target is listed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Compare the targets in the tree against the matrix
        run: |
          set -eu

          grep -rhoE '^func (Fuzz[A-Za-z0-9_]+)\(' --include='*_test.go' . \
            | sed -E 's/^func //; s/\($//' \
            | sort -u > /tmp/in-tree

          grep -oE 'target: (Fuzz[A-Za-z0-9_]+)' .github/workflows/fuzz.yml \
            | sed -E 's/^target: //' \
            | sort -u > /tmp/in-matrix

          missing="$(comm -23 /tmp/in-tree /tmp/in-matrix)"
          stale="$(comm -13 /tmp/in-tree /tmp/in-matrix)"

          if [ -n "${missing}" ]; then
            echo "These fuzz targets exist and are never fuzzed on the schedule:"
            echo "${missing}"
            echo
            echo "Add each to the matrix in .github/workflows/fuzz.yml."
          fi

          if [ -n "${stale}" ]; then
            echo "These are listed in the matrix and no longer exist:"
            echo "${stale}"
          fi

          if [ -n "${missing}" ] || [ -n "${stale}" ]; then
            exit 1
          fi

          echo "Every fuzz target in the tree is in the matrix."

  # An invariant names the tests that guard it. A name that no longer exists
  # is the document quietly becoming a description of what somebody once
  # intended, which is the failure mode invariants.md itself warns about: a
  # stale list is worse than no list, because a reader takes it as current.
  #
  # Two references had already rotted when this check was written. Neither was
  # noticed, because nothing reads that document except people, and people
  # read the prose rather than the citations.
  #
  # Deterministic, so it belongs on the critical path beside the fuzz matrix
  # check for the same reason.
  invariant-citations:
    name: Every invariant cites a test that exists
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Compare the names in invariants.md against the tree
        run: |
          set -eu

          grep -ohE '`(Test|Fuzz)[A-Za-z0-9_]+`' docs/invariants.md \
            | tr -d '`' | sort -u > /tmp/cited

          grep -rhoE '^func (Test|Fuzz)[A-Za-z0-9_]+' --include='*_test.go' . \
            | sed -E 's/^func //' | sort -u > /tmp/defined

          missing="$(comm -23 /tmp/cited /tmp/defined)"

          if [ -n "${missing}" ]; then
            echo "invariants.md names tests that do not exist:"
            echo "${missing}"
            echo
            echo "Rename the citation, or write the test. An invariant guarded by a"
            echo "name nobody can find is guarded by nothing."
            exit 1
          fi

          echo "Every test named in invariants.md exists."

  # A release is only reproducible if there is one build command to reproduce.
  #
  # scripts/build.sh says so in its own header, and the repository then kept
  # two more copies: one in scripts/release.ps1, which is what the maintainer
  # runs to check a release before signing it, and one in docs/verify.md, which
  # is what a stranger runs to check it afterwards. The second had already
  # drifted. It named `-X main.version=v0.1.0`, a symbol this program does not
  # define; Go accepts an unknown -X without complaint and folds the whole link
  # command into the build ID, so the published instructions produced a
  # different hash from the published binary — on the right source, with the
  # right compiler, for everybody who followed them.
  #
  # That is the worst way for this to fail. It does not hide tampering, it
  # manufactures it, and a check that reports tampering on every honest release
  # trains its readers to disregard the one that matters.
  #
  # Also parses release.ps1, which nothing else does. It runs once per release,
  # on the machine holding the signing key, and a syntax error in it surfaces
  # at the single worst moment to be improvising.
  build-command:
    name: One build command, and a release script that parses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Only scripts/build.sh carries the release build command
        run: |
          set -eu

          # -buildvcs is the marker: it appears in the release build and
          # nowhere else. ci.yml's `go build -trimpath ./...` is a compile
          # check, not a release build, and does not set the release flags.
          copies="$(grep -rlE 'go build[^#]*-buildvcs' \
            --include='*.sh' --include='*.ps1' --include='*.yml' \
            --include='*.md' --include='*.go' . | sort || true)"

          if [ "${copies}" != "./scripts/build.sh" ]; then
            echo "The release build command appears in more than one place:"
            echo "${copies}" | sed 's/^/  /'
            echo
            echo "Call scripts/build.sh instead of restating its flags. The flags"
            echo "decide the bytes, so a second copy is a second answer to what the"
            echo "release should hash to, and the copy that is wrong is the one"
            echo "nobody runs until it matters."
            exit 1
          fi

          echo "One copy: scripts/build.sh"

      - name: docs/verify.md points at that script
        run: |
          set -eu
          grep -q 'scripts/build\.sh' docs/verify.md || {
            echo "docs/verify.md no longer tells a verifier to run scripts/build.sh."
            echo "Whatever it tells them to run instead is a second build command."
            exit 1
          }
          echo "verify.md points at scripts/build.sh"

      - name: The release script parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/release.ps1'), [ref]$null, [ref]$errors) | Out-Null

          if ($errors) {
            $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
            Write-Host ''
            Write-Host 'scripts/release.ps1 does not parse. It runs once per release, on the'
            Write-Host 'machine holding the signing key; that is not where to discover this.'
            exit 1
          }

          Write-Host 'scripts/release.ps1 parses.'

  # A commit that reaches main unsigned is a commit nobody can attribute.
  #
  # This does not catch every way that can happen, and saying which is the
  # point. It checks the commits in a pull request. It cannot check what a
  # merge does to them afterwards, because that happens after every check has
  # already gone green — which is exactly how four unsigned commits reached
  # main on 2026-08-20 while ten checks reported success. That hole is closed
  # by a repository setting rather than by a job, and S6 records which.
  #
  # What this does catch is the ordinary case: somebody pushes a commit to a
  # branch without a signature, or with a key this project does not know.
  commit-signatures:
    name: Every commit in this pull request is signed by a known key
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out enough history to see the branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          # Full history, blobs on demand. A shallow fetch cannot express
          # base..head, and a full clone downloads every file this repository
          # has ever held to read a handful of signatures.
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --filter=blob:none origin \
            "+${BASE_SHA}:refs/base" "+${HEAD_SHA}:refs/head"
          git checkout -q refs/head

      - name: Verify each one against .github/commit-signers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          if [ ! -f .github/commit-signers ]; then
            echo ".github/commit-signers is missing, so nothing can be verified."
            echo "A check that cannot run must not pass quietly."
            exit 1
          fi

          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${PWD}/.github/commit-signers"

          bad=0
          checked=0
          for commit in $(git rev-list refs/base..refs/head); do
            checked=$((checked + 1))
            if git verify-commit "${commit}" 2>/dev/null; then
              continue
            fi
            printf 'unsigned or signed by an unknown key: %s %s\n' \
              "$(git log -1 --format=%h "${commit}")" \
              "$(git log -1 --format=%s "${commit}")"
            bad=$((bad + 1))
          done

          if [ "${bad}" -ne 0 ]; then
            echo
            echo "${bad} of ${checked} commits cannot be attributed to a key this"
            echo "repository publishes. Sign them:"
            echo
            echo "  git rebase --exec \"git commit --amend --no-edit -S\" ${BASE_SHA}"
            echo "  git push --force-with-lease"
            echo
            echo "If the key is new, add it to .github/commit-signers in this branch."
            exit 1
          fi

          echo "${checked} commits, every one signed by a published key."

  staticcheck:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...

  gosec:
    name: Security linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          "$(go env GOPATH)/bin/gosec" -severity medium -confidence medium ./...