name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny by default at the top level. Jobs opt in to what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────
# This workflow uses no third-party actions. Not one.
#
# `actions/checkout` is replaced by four lines of git, which is already
# on the runner. `actions/setup-go` is unnecessary: since Go 1.21, if
# go.mod declares a newer version than the installed toolchain, the go
# command downloads the correct toolchain itself.
#
# Two things follow from that. The organisation policy requiring every
# action to be pinned to a full-length commit SHA cannot be violated,
# because there is nothing to pin. And the claim in README.md that this
# project has no third-party dependencies stays true in the build
# pipeline, not only in the shipped binary.
#
# The `go install ...@latest` lines below do fetch code, but through the
# Go module proxy, which verifies every module against the checksum
# database at sum.golang.org. That is a stronger integrity guarantee
# than a git tag, which anyone with write access can move.
# ─────────────────────────────────────────────────────────────────────

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Report toolchain
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go mod tidy modified the repository:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Verify module checksums
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test with race detector
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Build
        run: go build -trimpath ./...

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      # govulncheck reports only vulnerabilities on code paths actually
      # reachable from this module, so a hit here is a real problem rather
      # than a version-range guess.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # A fuzz target that exists and is not in the matrix is a target nobody
  # fuzzes.
  #
  # The matrix in fuzz.yml is written by hand, deliberately: one job per target
  # names the failing one in the job list. The cost is that adding a target
  # takes two edits in two files, and the second is easy to forget — and
  # forgetting it fails quietly. The target still runs against its seeds here,
  # so everything looks green while the generative run that would actually find
  # something never happens.
  #
  # This lives in CI rather than in fuzz.yml for the reason fuzz.yml gives for
  # keeping the seed corpus here: the check is deterministic, so it belongs on
  # the critical path. Generative fuzzing is not, so it does not. A guard that
  # only runs on a nightly schedule tells somebody about their mistake the
  # morning after they stopped thinking about it.
  fuzz-targets:
    name: Every fuzz target is listed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Compare the targets in the tree against the matrix
        run: |
          set -eu

          grep -rhoE '^func (Fuzz[A-Za-z0-9_]+)\(' --include='*_test.go' . \
            | sed -E 's/^func //; s/\($//' \
            | sort -u > /tmp/in-tree

          grep -oE 'target: (Fuzz[A-Za-z0-9_]+)' .github/workflows/fuzz.yml \
            | sed -E 's/^target: //' \
            | sort -u > /tmp/in-matrix

          missing="$(comm -23 /tmp/in-tree /tmp/in-matrix)"
          stale="$(comm -13 /tmp/in-tree /tmp/in-matrix)"

          if [ -n "${missing}" ]; then
            echo "These fuzz targets exist and are never fuzzed on the schedule:"
            echo "${missing}"
            echo
            echo "Add each to the matrix in .github/workflows/fuzz.yml."
          fi

          if [ -n "${stale}" ]; then
            echo "These are listed in the matrix and no longer exist:"
            echo "${stale}"
          fi

          if [ -n "${missing}" ] || [ -n "${stale}" ]; then
            exit 1
          fi

          echo "Every fuzz target in the tree is in the matrix."

  staticcheck:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...

  gosec:
    name: Security linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          "$(go env GOPATH)/bin/gosec" -severity medium -confidence medium ./...