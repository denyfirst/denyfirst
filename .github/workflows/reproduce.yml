name: Reproduce

# Rebuilds a published release from its tag and checks that the result is
# byte-identical to what was uploaded.
#
# The binaries are built by build-release.yml on a runner like this one, so
# this is not a formality: it confirms that what was published is what the
# build produced, and that neither the assets nor anything between the two was
# altered.
#
# What it cannot confirm on its own is that the source was not altered before
# the build. That is what the signature is for, and the two together are the
# whole claim: a public runner builds, the maintainer signs, and anyone can
# repeat the build.
#
# # Everything here must match build-release.yml exactly
#
# The flags, the target list, and the toolchain. Not approximately — exactly.
# A single extra ldflag makes every binary differ, and the failure looks
# identical to tampering: ten mismatched hashes and no indication which of the
# two files is wrong.
#
# That has now happened twice. The first time, this file installed a toolchain
# into /usr/local/go while the build used the one go.mod fetches into the
# module cache, so GOROOT differed and -trimpath does not reach GOROOT. The
# second, this file carried -X main.version and the build did not.
#
# So: no manual toolchain installation, and the flags below are copied from
# build-release.yml rather than written again.
#
# Nothing here signs anything. The signing key is deliberately absent from
# GitHub, because a key stored here would let whoever compromised this account
# sign a release, which is the attack the signature exists to prevent.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to reproduce"
        required: true

permissions: {}

jobs:
  reproduce:
    name: Reproduce the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Check out the tagged source
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/tags/${TAG}"
          git checkout -q FETCH_HEAD
          echo "commit $(git rev-parse HEAD)"

      - name: Fetch the published checksums and build record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${TAG}" --pattern SHA256SUMS --dir published --clobber
          gh release download "${TAG}" --pattern BUILD --dir published --clobber

          echo "── how the release was built ──"
          cat published/BUILD

      - name: Report this toolchain
        run: |
          set -euo pipefail

          # No installation. The go directive in go.mod names the version and
          # the toolchain mechanism fetches it into the module cache, which is
          # where the build that produced this release got it too. Installing
          # one to /usr/local/go instead puts a different GOROOT in the runtime
          # package, and every binary then differs by a path that has nothing
          # to do with the source.
          echo "── how this reproduction is built ──"
          echo "toolchain $(go version)"
          echo "goroot $(go env GOROOT)"
          echo "runner ${RUNNER_OS} ${RUNNER_ARCH}"

      - name: Build every target
        run: |
          set -euo pipefail
          mkdir -p rebuilt

          # These two lines are the ones that must match build-release.yml.
          # Change one and change the other in the same commit.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"

            for command in denyfirst-scan denyfirstd; do
              name="${command}_${TAG}_${os}_${arch}"
              [ "$os" = "windows" ] && name="${name}.exe"

              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -buildvcs=false \
                  -ldflags "-s -w" \
                  -o "rebuilt/${name}" "./cmd/${command}"
            done
          done

          ls -la rebuilt

      - name: Compare
        run: |
          set -euo pipefail

          cd rebuilt
          sha256sum * | sort -k2 > ../rebuilt.sums
          cd ..

          # The published list includes SHA256SUMS itself and the BUILD record,
          # neither of which is rebuilt here.
          grep -v -E '(SHA256SUMS|BUILD)' published/SHA256SUMS | sort -k2 > published.sums

          if diff -u published.sums rebuilt.sums; then
            echo
            echo "The published binaries match a build of the tagged source."
            exit 0
          fi

          echo
          echo "The published binaries do NOT match a build of the tagged source."
          echo
          echo "Before assuming tampering, compare the two records printed above."
          echo "A different Go version, a different GOROOT, or a different set of"
          echo "build flags each produce ten mismatched hashes and look exactly"
          echo "like an altered binary. Both have happened here, and neither was"
          echo "an attack."
          echo
          echo "If the toolchain and the flags agree and the hashes still do not,"
          echo "that is the case this check exists for."
          exit 1