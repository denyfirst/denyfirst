name: Reproduce

# Rebuilds a published release from its tag and checks that the result is
# byte-identical to what was uploaded.
#
# The binaries are built by build-release.yml on a runner like this one, so
# this is not a formality: it confirms that what was published is what the
# build produced, and that nothing between the two altered it.
#
# What it cannot confirm on its own is that the source was not altered before
# the build. That is what the signature is for, and the two together are the
# whole claim: a public runner builds, the maintainer signs, and anyone can
# repeat the build.
#
# # The build command lives in scripts/build.sh
#
# Both this workflow and build-release.yml call it. That was not the original
# arrangement: each had its own copy, and they drifted twice in one afternoon
# — once over which toolchain was installed and where, once over an ldflag
# that one carried and the other did not. Each time ten hashes disagreed and
# the failure looked exactly like a tampered binary.
#
# A reproduction check is only worth running if a mismatch means something,
# and two copies of a build command guarantee that a mismatch eventually means
# nothing at all.
#
# Nothing here signs anything. The signing key is deliberately absent from
# GitHub, because a key stored here would let whoever compromised this account
# sign a release, which is the attack the signature exists to prevent.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to reproduce"
        required: true

permissions: {}

jobs:
  reproduce:
    name: Reproduce the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Check out the tagged source
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/tags/${TAG}"
          git checkout -q FETCH_HEAD
          echo "commit $(git rev-parse HEAD)"

      - name: Fetch the published checksums and build record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${TAG}" --pattern SHA256SUMS --dir published --clobber
          gh release download "${TAG}" --pattern BUILD --dir published --clobber

          echo "── how the release was built ──"
          cat published/BUILD

      - name: Settle which build script is used, and prove it is the right one
        run: |
          set -euo pipefail

          # The tag's own script when it has one, and the default branch only
          # when the tag predates it: the script was introduced after v0.1.0
          # was cut, and that release would otherwise be unreproducible for
          # ever.
          #
          # Then the part that makes any of this mean something. Whichever
          # copy is used, its hash has to equal the one recorded when the
          # release was built. Without that check this workflow reproduces a
          # build using whatever procedure is current, so somebody who can
          # move the default branch changes what is built AND what it is
          # compared against, and the reproduction agrees with itself while
          # agreeing with nothing a reader can verify.
          #
          # A build command is not source, but it decides the bytes, and a
          # check that cannot tell a changed procedure from a changed binary
          # is not a check.
          if [ -f scripts/build.sh ]; then
            echo "using scripts/build.sh from the tag"
          else
            echo "the tag predates scripts/build.sh; falling back to the default branch"
            mkdir -p scripts
            curl -fsSL \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/build.sh" \
              -o scripts/build.sh
          fi
          chmod +x scripts/build.sh

          have=$(sha256sum scripts/build.sh | cut -d' ' -f1)
          want=$(awk '$1 == "buildscript" { print $2 }' published/BUILD)

          echo "buildscript ${have}"

          if [ -z "${want}" ]; then
            echo "::error::The BUILD record names no build script, so this reproduction cannot say" >&2
            echo "which procedure produced the release. Releases from before that field existed" >&2
            echo "have to be checked by hand." >&2
            exit 1
          fi

          if [ "${have}" != "${want}" ]; then
            echo "::error::The build script is not the one that built this release." >&2
            echo "  released with ${want}" >&2
            echo "  reproducing with ${have}" >&2
            echo >&2
            echo "Either the procedure changed since the release, which makes a byte comparison" >&2
            echo "meaningless, or somebody changed it in order to change what is built. Both are" >&2
            echo "answered the same way: read the diff of scripts/build.sh before going further." >&2
            exit 1
          fi

      - name: Check that the release is actually signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # "Nothing reaches a user unsigned" was a procedure, not a property.
          #
          # The signature is made on the maintainer's machine and uploaded by
          # hand, so a draft published a step early — or published from a
          # phone, or by somebody who took the account — reaches every user
          # with no signature and nothing anywhere says so. This runs on
          # publication and says so in public.
          #
          # It is checked against the tag's own .allowed_signers, which is the
          # file a reader checking out that tag would use, and the step below
          # then requires that file to be the one on the default branch, which
          # is the file verify.md tells a reader to fetch. Either alone can be
          # moved by whoever can write to this repository; disagreeing is the
          # thing worth catching.
          gh release download "${TAG}" --pattern SHA256SUMS.sig --dir published --clobber

          ssh-keygen -Y verify \
            -f .allowed_signers \
            -I releases@denyfirst.dev \
            -n file \
            -s published/SHA256SUMS.sig \
            < published/SHA256SUMS

      - name: Check that the tag trusts the same keys as the default branch
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.allowed_signers" \
            -o /tmp/allowed_signers.main

          if ! diff -u .allowed_signers /tmp/allowed_signers.main; then
            echo "::error::This tag trusts a different set of release keys from the default branch." >&2
            echo "A reader following docs/verify.md fetches the default branch's copy, so the two" >&2
            echo "have to agree or the signature that verified above is not the one they check." >&2
            exit 1
          fi

          echo "The tag and the default branch trust the same keys."

      - name: Report this toolchain
        run: |
          set -euo pipefail

          # No installation. The go directive in go.mod names the version and
          # the toolchain mechanism fetches it into the module cache, which is
          # where the build that produced this release got it too. Installing
          # one to /usr/local/go instead puts a different GOROOT in the runtime
          # package, and every binary then differs by a path that has nothing
          # to do with the source.
          echo "── how this reproduction is built ──"
          echo "toolchain $(go version)"
          echo "goroot $(go env GOROOT)"
          echo "runner ${RUNNER_OS} ${RUNNER_ARCH}"

      - name: Build every target
        run: ./scripts/build.sh "${TAG}" rebuilt

      - name: Compare
        run: |
          set -euo pipefail

          cd rebuilt
          sha256sum * | sort -k2 > ../rebuilt.sums
          cd ..

          # The published list includes the BUILD record, which is not rebuilt
          # here. Matched on the whole name rather than as a substring: the
          # earlier pattern also dropped any asset whose name merely contained
          # "BUILD" or "SHA256SUMS", which is a way to add a file to a release
          # and have this comparison ignore it.
          awk '$2 != "SHA256SUMS" && $2 != "BUILD"' published/SHA256SUMS | sort -k2 > published.sums

          if diff -u published.sums rebuilt.sums; then
            echo
            echo "The published binaries match a build of the tagged source."
            exit 0
          fi

          echo
          echo "The published binaries do NOT match a build of the tagged source."
          echo
          echo "Before assuming tampering, compare the two records printed above."
          echo "A different Go version, a different GOROOT, or a different build"
          echo "script each produce ten mismatched hashes and look exactly like an"
          echo "altered binary. All three have happened here, and none was an"
          echo "attack."
          echo
          echo "If the toolchain and the build script agree and the hashes still"
          echo "do not, that is the case this check exists for."
          exit 1