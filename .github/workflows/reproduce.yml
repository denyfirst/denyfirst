name: Reproduce

# Rebuilds a published release from its tag and checks that the result is
# byte-identical to what was uploaded.
#
# The binaries are built by build-release.yml on a runner like this one, so
# this is not a formality: it confirms that what was published is what the
# build produced, and that nothing between the two altered it.
#
# What it cannot confirm on its own is that the source was not altered before
# the build. That is what the signature is for, and the two together are the
# whole claim: a public runner builds, the maintainer signs, and anyone can
# repeat the build.
#
# # The build command lives in scripts/build.sh
#
# Both this workflow and build-release.yml call it. That was not the original
# arrangement: each had its own copy, and they drifted twice in one afternoon
# — once over which toolchain was installed and where, once over an ldflag
# that one carried and the other did not. Each time ten hashes disagreed and
# the failure looked exactly like a tampered binary.
#
# A reproduction check is only worth running if a mismatch means something,
# and two copies of a build command guarantee that a mismatch eventually means
# nothing at all.
#
# Nothing here signs anything. The signing key is deliberately absent from
# GitHub, because a key stored here would let whoever compromised this account
# sign a release, which is the attack the signature exists to prevent.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to reproduce"
        required: true

permissions: {}

jobs:
  reproduce:
    name: Reproduce the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Check out the tagged source
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/tags/${TAG}"
          git checkout -q FETCH_HEAD
          echo "commit $(git rev-parse HEAD)"

      - name: Fetch the published checksums and build record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${TAG}" --pattern SHA256SUMS --dir published --clobber
          gh release download "${TAG}" --pattern BUILD --dir published --clobber

          echo "── how the release was built ──"
          cat published/BUILD

      - name: Fetch the build script from the default branch
        run: |
          set -euo pipefail

          # Taken from the default branch rather than from the tag, because it
          # may not exist there: the script was introduced after v0.1.0 was
          # cut, and a release from before it would otherwise be
          # unreproducible for ever.
          #
          # This is defensible on its own terms. The question a reproduction
          # answers is whether the binaries correspond to the source, and a
          # build command is not source — it is procedure. Both the release
          # build and this one read the same procedure from the same place,
          # which is what makes a mismatch mean something.
          #
          # The BUILD record names the script's hash, so a release built with
          # an older procedure can say so rather than failing silently.
          mkdir -p scripts
          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/build.sh" \
            -o scripts/build.sh
          chmod +x scripts/build.sh
          echo "buildscript $(sha256sum scripts/build.sh | cut -d' ' -f1)"

      - name: Report this toolchain
        run: |
          set -euo pipefail

          # No installation. The go directive in go.mod names the version and
          # the toolchain mechanism fetches it into the module cache, which is
          # where the build that produced this release got it too. Installing
          # one to /usr/local/go instead puts a different GOROOT in the runtime
          # package, and every binary then differs by a path that has nothing
          # to do with the source.
          echo "── how this reproduction is built ──"
          echo "toolchain $(go version)"
          echo "goroot $(go env GOROOT)"
          echo "runner ${RUNNER_OS} ${RUNNER_ARCH}"

      - name: Build every target
        run: ./scripts/build.sh "${TAG}" rebuilt

      - name: Compare
        run: |
          set -euo pipefail

          cd rebuilt
          sha256sum * | sort -k2 > ../rebuilt.sums
          cd ..

          # The published list includes SHA256SUMS itself and the BUILD record,
          # neither of which is rebuilt here.
          grep -v -E '(SHA256SUMS|BUILD)' published/SHA256SUMS | sort -k2 > published.sums

          if diff -u published.sums rebuilt.sums; then
            echo
            echo "The published binaries match a build of the tagged source."
            exit 0
          fi

          echo
          echo "The published binaries do NOT match a build of the tagged source."
          echo
          echo "Before assuming tampering, compare the two records printed above."
          echo "A different Go version, a different GOROOT, or a different build"
          echo "script each produce ten mismatched hashes and look exactly like an"
          echo "altered binary. All three have happened here, and none was an"
          echo "attack."
          echo
          echo "If the toolchain and the build script agree and the hashes still"
          echo "do not, that is the case this check exists for."
          exit 1