name: Build release artifacts

# Builds the binaries for a tag on a machine the maintainer does not control,
# in a log anyone can read, and leaves them in a draft release for signing.
#
# # Why the build is not done on the maintainer's machine
#
# A signature says a release came from whoever holds the key. It says nothing
# about whether the binaries correspond to the source anyone can read, and
# that is the more valuable claim: a compromised laptop could sign a subtly
# altered scanner, and a grading rule that always reports one server as strong
# would be worth more to an attacker than a backdoor and far harder to notice.
#
# The reproduction check exists to close that gap, and it closes nothing
# unless it runs. That used to be the argument for building here: a
# cross-compile from the maintainer's Windows machine was believed to produce
# different bytes, because GOROOT ends up in the runtime package and -trimpath
# was thought not to reach it, so the check would have failed on every honest
# release — which is worse than no check at all.
#
# Measured on 2026-08-23 and the belief was wrong: ten artifacts built from
# Windows against v0.3.0 matched this workflow's byte for byte, because the
# toolchain came from the module cache rather than an installed GOROOT and
# -trimpath does normalise module cache paths. The correction is recorded
# rather than quietly dropped, because the sentence had been repeated in four
# places and was steering people away from a check that works.
#
# The reason to build here survives it, and it is the stronger reason anyway:
# a signature says a release came from whoever holds the key and says nothing
# about whether the binaries correspond to the source, so the two have to be
# done by different parties. The build happens here and the maintainer signs
# the result rather than producing it: this workflow builds and cannot sign,
# the maintainer signs and does not build, and compromising either alone
# yields nothing.
#
# # Why a draft release rather than an artifact
#
# upload-artifact is a third-party action and this organisation allows none.
# That is not caution about that particular action; it is that every step in
# every workflow here is a shell command, so the only thing to audit is this
# repository. The first attempt at this file used it and was refused before
# the job started, which is the policy doing its work.
#
# A draft is invisible to anyone but the maintainer until published, so the
# binaries wait here until every hash has been checked and the list signed.
# Nothing reaches a user unsigned.
#
# Nothing here signs anything. The key is deliberately absent from GitHub: one
# stored in these secrets would let whoever took the account sign a release,
# which is the attack the signature exists to prevent.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Write, because this creates a draft release. Narrower is not possible:
    # the release API has no read-only way to stage assets.
    permissions:
      contents: write

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged source
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/tags/${TAG}"
          git checkout -q FETCH_HEAD
          echo "commit $(git rev-parse HEAD)"

      - name: Settle which build script is used
        run: |
          set -euo pipefail

          # The tag's own script when it has one.
          #
          # It used to be fetched from the default branch unconditionally, and
          # that was a hole rather than a shortcut. The tagged source was
          # checked out honestly and then built by a procedure taken from a
          # branch anybody with write access can move — so a pushed commit
          # could not become a signed release, but it could decide what the
          # signed bytes were. reproduce.yml read the same mutable file, so
          # the reproduction reproduced the tampering and reported a match.
          #
          # The fallback stays because v0.1.0 was cut before scripts/build.sh
          # existed and would otherwise be unbuildable for ever. It is a
          # fallback now rather than the rule, and the hash below records
          # which one ran either way.
          if [ -f scripts/build.sh ]; then
            echo "using scripts/build.sh from the tag"
          else
            echo "the tag predates scripts/build.sh; falling back to the default branch"
            mkdir -p scripts
            curl -fsSL \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/build.sh" \
              -o scripts/build.sh
          fi
          chmod +x scripts/build.sh
          echo "buildscript $(sha256sum scripts/build.sh | cut -d' ' -f1)"

      - name: Report the toolchain
        run: |
          go version
          go env GOROOT

      - name: Build
        run: ./scripts/build.sh "${TAG}" dist

      - name: Write the checksums and the build record
        run: |
          set -euo pipefail

          # The record exists so a reproduction that fails can say why. Two Go
          # versions produce different bytes from identical source, and so do
          # two build scripts; without this, a mismatch is indistinguishable
          # from tampering.
          script_hash=$(sha256sum scripts/build.sh | cut -d' ' -f1)
          commit=$(git rev-parse HEAD)
          toolchain=$(go version)
          goroot=$(go env GOROOT)

          cd dist

          # BUILD is written before the checksums are taken, so it is listed
          # in SHA256SUMS and therefore covered by the signature over that
          # file.
          #
          # The other order left the provenance record unsigned while
          # reproduce.yml used it to decide whether a mismatch was tampering
          # or a different toolchain. Anyone able to replace an asset could
          # therefore write the excuse for their own mismatch.
          {
            echo "tag ${TAG}"
            echo "commit ${commit}"
            echo "toolchain ${toolchain}"
            echo "goroot ${goroot}"
            echo "runner ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "buildscript ${script_hash}"
            echo "cgo disabled"
            echo "workflow ${GITHUB_RUN_ID}"
          } > BUILD

          # sha256sum's own format, so a reader can check it with sha256sum -c
          # and nothing else. Sorted by name for a stable file.
          #
          # Written outside this directory and moved in, which is not
          # fastidiousness. `sha256sum * > SHA256SUMS` is a race: the shell
          # creates the redirection target and expands the glob in two
          # different children, so roughly one run in three the list contains
          # a line for itself carrying the hash of an empty file. release.ps1
          # then verifies every listed name, finds SHA256SUMS does not match
          # its own recorded hash, and refuses to sign — an intermittent
          # release failure with no cause visible in the log, on the one
          # procedure that must never be guessed at.
          sha256sum -- * | sort -k2 > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS

          echo "── SHA256SUMS ──"
          cat SHA256SUMS
          echo
          echo "── BUILD ──"
          cat BUILD

      - name: Refuse to stage a build that does not pass its own tests
        run: |
          set -euo pipefail

          # A tag can be put on any commit. CI runs on pushes and pull
          # requests, so the default branch is green; nothing checked that the
          # commit being released was one of those, and a tag placed on an
          # older or an unmerged commit produced a draft release with no gate
          # in front of it at all.
          #
          # Run after the build rather than before it. Nothing a gate installs
          # or compiles can then have influenced the bytes that were produced,
          # which keeps the reproduction comparing like with like.
          go vet ./...
          go test ./...

      - name: Refuse to stage a build with a known vulnerability
        run: |
          set -euo pipefail

          # S2 says known vulnerabilities block a release, and until now the
          # only thing enforcing it ran on pushes and pull requests. That is
          # not the same claim: govulncheck's answer changes when Go publishes
          # a security release, without a line of this repository changing, so
          # a commit that was clean when it merged can be shipped weeks later
          # carrying a known reachable vulnerability with every check green.
          #
          # Pinned to the version CI uses. Two pins that drift apart mean a
          # release gate and a merge gate that disagree about what is known.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Stage a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A draft is replaced rather than added to, so a rerun after a failed
          # build does not leave half of one attempt beside half of another.
          #
          # A published release is not. `gh release view` finds those too, so
          # the earlier version of this deleted a signed release — signature
          # and all — whenever somebody dispatched this workflow with a tag
          # that had already shipped. Rebuilding is a recovery step; deleting
          # what users are verifying against is not.
          if gh release view "${TAG}" > /dev/null 2>&1; then
            if [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "replacing the existing draft for ${TAG}"
              gh release delete "${TAG}" --yes
            else
              echo "::error::${TAG} is already published. Refusing to delete a released tag." >&2
              echo "Cut a new tag, or delete this release by hand if it really is wrong." >&2
              exit 1
            fi
          fi

          gh release create "${TAG}" dist/* \
            --draft \
            --title "${TAG}" \
            --notes "Built by workflow run ${GITHUB_RUN_ID} from $(git rev-parse HEAD).

          This draft has no signature yet. It becomes a release once the
          maintainer has checked every hash against SHA256SUMS, signed that
          file, and uploaded SHA256SUMS.sig."

          echo
          echo "Draft staged. The maintainer signs it with:"
          # The child-process form, because the bare path does not work: a
          # default Windows installation refuses to run a script file at all,
          # so this line used to print an instruction that fails before the
          # script starts. The procedure is docs/releasing.md.
          echo "  powershell.exe -ExecutionPolicy Bypass -File .\\scripts\\release.ps1 -Tag ${TAG} -Compare"
          echo
          echo "The procedure, including the dry run, is docs/releasing.md."