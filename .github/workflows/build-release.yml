name: Build release artifacts

# Builds the binaries for a tag and publishes them as an artifact, in public,
# on a machine the maintainer does not control.
#
# # Why the build is not done on the maintainer's machine
#
# The signature says a release came from whoever holds the key. It says
# nothing about whether the binaries correspond to the source anyone can read,
# and that is the more valuable claim: a compromised laptop could sign a
# subtly altered scanner — a grading rule that always reports one server as
# strong would be worth more to an attacker than a backdoor and far harder to
# notice.
#
# The reproduction check exists to close that, and it only closes it if it
# actually runs. Cross-compiling from Windows produces different bytes to
# building on Linux, because GOROOT ends up in the runtime package and
# -trimpath does not reach it. The check therefore failed on every honest
# release, which is worse than having no check: a red mark nobody can act on
# teaches everyone to ignore it.
#
# So the build happens here, in a log anyone can read, and the maintainer
# signs the result rather than producing it. Two separate parties are now
# involved in a release: this workflow, which builds but cannot sign, and the
# maintainer, who signs but does not build. Compromising either one alone
# yields nothing.
#
# Nothing here signs anything. The key is deliberately absent from GitHub,
# because a key stored in these secrets would let whoever took the account
# sign a release, which is the attack the signature exists to prevent.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged source
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "refs/tags/${TAG}"
          git checkout -q FETCH_HEAD
          echo "commit $(git rev-parse HEAD)"

      - name: Report the toolchain
        run: |
          go version
          go env GOROOT

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"

            for command in denyfirst-scan denyfirstd; do
              name="${command}_${TAG}_${os}_${arch}"
              [ "$os" = "windows" ] && name="${name}.exe"

              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -buildvcs=false \
                  -ldflags "-s -w" \
                  -o "dist/${name}" "./cmd/${command}"
            done
          done

          ls -la dist

      - name: Write the checksums and the build record
        run: |
          set -euo pipefail
          cd dist

          # sha256sum's own format, so a reader can check it with sha256sum -c
          # and nothing else. Sorted by name for a stable file.
          sha256sum * | sort -k2 > SHA256SUMS

          {
            echo "tag ${TAG}"
            echo "commit $(git rev-parse HEAD)"
            echo "toolchain $(go version)"
            echo "goroot $(go env GOROOT)"
            echo "runner ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "flags -trimpath -buildvcs=false -ldflags '-s -w'"
            echo "cgo disabled"
            echo "workflow ${GITHUB_RUN_ID}"
          } > BUILD

          cat SHA256SUMS
          echo
          cat BUILD

      - name: Publish the artifact
        uses: actions/upload-artifact@v4
        with:
          name: denyfirst-${{ env.TAG }}
          path: dist/
          retention-days: 30
          if-no-files-found: error