name: Fuzz

# Active fuzzing runs on a schedule rather than on every push.
#
# The seed corpus already runs in the ordinary test job, because `go test`
# executes each fuzz target against its seeds. That part is deterministic and
# belongs on the critical path.
#
# Generative fuzzing is not deterministic. A crash discovered while somebody
# was fixing a typo would fail their pull request for a reason that has nothing
# to do with their change, and the usual response to that is to stop reading
# the failures. Running it apart keeps a real finding legible.
on:
  schedule:
    # Nightly, at a time chosen to avoid the top of the hour when GitHub's
    # scheduler is busiest and jobs queue.
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds to spend on each target"
        required: false
        default: "120"

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      # One target per job, so a crash in one does not hide the others, and
      # the failing target is named in the job list.
      fail-fast: false
      matrix:
        include:
          - package: ./internal/scan
            target: FuzzSplitTarget
          - package: ./internal/scan
            target: FuzzCheckPort
          - package: ./internal/policy
            target: FuzzGradeCipher
          - package: ./internal/policy
            target: FuzzGradeLeaf
          # The chain grader, added with denyfirst-v6. It builds sentences out
          # of a certificate's subject, which is text the scanned server
          # chooses, and the fuzzer found three ways to leave a hole in one
          # within four minutes of first being pointed at it.
          - package: ./internal/policy
            target: FuzzGradeIssuer
          - package: ./internal/policy
            target: FuzzMaxValidityDays
          - package: ./internal/certinfo
            target: FuzzAnalyse
          - package: ./internal/certinfo
            target: FuzzParseSCTList
          - package: ./internal/dnsclient
            target: FuzzParseReply
          - package: ./internal/dnsclient
            target: FuzzSkipName
          # Everything this target reads is chosen by the scanned server, and
          # it is the only cryptographic parser this project owns.
          - package: ./internal/ocsp
            target: FuzzCheck
          - package: ./internal/httpapi
            target: FuzzScanHandler

    steps:
      - name: Check out the commit under test
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      # The matrix values are read through the environment rather than
      # interpolated into the script. They are literals from this file, so
      # nothing is exploitable today; the habit is what protects the edit that
      # one day puts something less predictable in a matrix.
      - name: Fuzz ${{ matrix.target }}
        env:
          DURATION: ${{ inputs.duration || '120' }}
          PKG: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -uo pipefail

          # `set -e` is deliberately absent: the exit status of `go test` is
          # classified here rather than propagated, and the reason is the whole
          # value of this workflow.
          #
          # `go test -fuzz` installs the -fuzztime duration as a context
          # deadline on its coordinator (src/internal/fuzz/fuzz.go, the
          # context.WithTimeout on opts.Timeout). On the way out the
          # coordinator means to swallow that deadline, and does it by
          # comparing the error it holds against fuzzCtx.Err() with `==` — a
          # comparison between two different contexts' errors, on a shutdown
          # path with several goroutines in it. When it does not hold, a run
          # that found nothing ends:
          #
          #     --- FAIL: FuzzSplitTarget (120.09s)
          #         context deadline exceeded
          #
          # Observed on 2026-08-27, run 33082895964, on go1.26.7: executions
          # were still climbing at 26k/sec at the 2m0s mark, no input was
          # written, the reproducer step found nothing to keep, and the four
          # nightly runs after it were clean. The absence of the
          # "Failing input written to" line is what settles it — src/testing/
          # fuzz.go prints that for every error that carries a crash, so an
          # error without it carries none.
          #
          # Left alone this is worse than a nuisance. This is the one gate that
          # finds what nobody thought to test, it runs at 03:37 where nobody is
          # watching, and a gate that goes red for a reason other than its own
          # subject teaches people to skip it — including on the night it means
          # something. The first one of these went unread for five days.
          #
          # So the shape is named, narrowly, and everything else still fails. A
          # lost run is not made up by retrying: two minutes of fuzzing once a
          # fortnight is worth nothing beside a signal that can be trusted.

          out="${RUNNER_TEMP}/fuzz.out"
          crashers="${PKG}/testdata/fuzz"

          status=0
          go test "${PKG}" \
            -run '^$' \
            -fuzz "^${TARGET}$" \
            -fuzztime "${DURATION}s" > "${out}" 2>&1 || status=$?
          cat "${out}"

          # A finding is looked for first, so that a run which both found an
          # input and tripped the deadline is reported as a finding.
          #
          # Go writes the input under testdata/fuzz and says where, so either
          # half is enough. Keeping it is the point: the file turns a random
          # discovery into a permanent regression test once it is committed.
          #
          # It goes into the job summary and an annotation as well as the log,
          # because the log is the only copy and it expires in ninety days.
          # Nothing here uploads an artifact: no third-party action is allowed
          # in this organisation, and that is not a rule to work around.
          if [ -d "${crashers}" ] || grep -q 'Failing input written to ' "${out}"; then
            echo "::error::${TARGET} found a failing input. The reproducer is in this job's summary."
            {
              echo "## ${TARGET} found a failing input"
              echo
              echo "Commit each file below under \`${crashers}\` so the case joins the"
              echo "seed corpus and cannot come back unnoticed."
            } >> "${GITHUB_STEP_SUMMARY}"

            if [ -d "${crashers}" ]; then
              find "${crashers}" -type f -print0 | while IFS= read -r -d '' f; do
                echo "--- ${f}"
                cat "${f}"
                {
                  echo
                  echo "### \`${f}\`"
                  echo '```'
                  cat "${f}"
                  echo '```'
                } >> "${GITHUB_STEP_SUMMARY}"
              done
            fi

            exit 1
          fi

          if [ "${status}" -eq 0 ]; then
            echo "${TARGET}: ${DURATION}s, nothing found."
            exit 0
          fi

          # Nothing was found and the run failed anyway. Exactly one shape is
          # allowed through, and every part of it is required: one failing
          # target, the coordinator's own deadline as the whole of the message,
          # a duration that reached the budget, and none of the lines the
          # toolchain prints when something real went wrong.
          reported="$(sed -n "s/^--- FAIL: ${TARGET} (\([0-9]\{1,\}\)\.[0-9]\{1,\}s)$/\1/p" "${out}" | head -n 1)"
          fails="$(grep -c '^--- FAIL: ' "${out}")"

          if [ "${fails}" = "1" ] \
            && [ -n "${reported}" ] \
            && [ "${reported}" -ge "${DURATION}" ] \
            && grep -qE '^ *context deadline exceeded$' "${out}" \
            && ! grep -qE 'panic:|SIGSEGV|failure while testing seed corpus entry|hung or terminated unexpectedly|terminated by unexpected signal|exited unexpectedly due to an internal failure' "${out}"
          then
            # Not resting the pass on the absence of a file. The seeds run
            # again with no deadline anywhere in the picture, so a target that
            # is genuinely failing fails here, where nothing suppresses it.
            if ! go test "${PKG}" -run "^${TARGET}$" -count=1; then
              echo "::error::${TARGET}: the seed corpus fails as well, so this is not the deadline artefact."
              exit 1
            fi

            echo "::warning::${TARGET}: -fuzztime expired and the coordinator reported its own deadline as a failure. No input was found and the seed corpus re-ran clean."
            {
              echo "### ${TARGET} — the coordinator's deadline, not a finding"
              echo
              echo "\`go test -fuzz\` ended after ${reported}s of a ${DURATION}s run with"
              echo "\`context deadline exceeded\`. No failing input was written and the seed"
              echo "corpus re-ran clean, so this run found nothing."
              echo
              echo "If this line appears most nights it has stopped being noise and is worth"
              echo "chasing upstream. The reasoning is in \`.github/workflows/fuzz.yml\`."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "::error::${TARGET} failed in a way this step does not recognise. Read the log; do not assume it is the deadline artefact."
          exit 1
